# ═══════════════════════════════════════════════════════════════
#  Простор за nginx (on-premise): TLS, web и WebSocket на одном домене.
#  В .env: APP_URL=https://board.example.ru, WS_PUBLIC_URL=wss://board.example.ru/ws,
#          WS_ALLOWED_ORIGINS=https://board.example.ru
#  Сертификат — certbot / корпоративный CA.
# ═══════════════════════════════════════════════════════════════

upstream prostor_web { server 127.0.0.1:3000; keepalive 32; }
# Несколько WS-инстансов (docker compose up --scale ws=3) — перечислите их здесь.
# Липкие сессии не нужны: комнаты синхронизируются через Redis.
upstream prostor_ws  { server 127.0.0.1:1234; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name board.example.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name board.example.ru;

  ssl_certificate     /etc/ssl/prostor/fullchain.pem;
  ssl_certificate_key /etc/ssl/prostor/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Загрузка изображений и PDF (лимит приложения — 20 МБ на файл)
  client_max_body_size 25m;
  # Сохранение версии большой доски шлёт её состояние целиком
  location ~ ^/api/boards/[^/]+/versions$ {
    client_max_body_size 64m;
    proxy_pass http://prostor_web;
    include /etc/nginx/proxy_params;
  }

  # WebSocket: /ws/<комната> → ws-сервер получает /<комната> (префикс срезается)
  location /ws/ {
    proxy_pass http://prostor_ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Соединения живут часами; клиент сам переподключается при обрыве
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://prostor_web;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
